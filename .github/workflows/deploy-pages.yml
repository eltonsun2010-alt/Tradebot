name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/southpage-portfolio-site-nbnb0w"]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer run supersede an in-progress one.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Turns on GitHub Pages (Actions source) if it isn't already, so the
      # deploy step below doesn't require any manual repo-settings toggle.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          BUILD_STATIC: "true"
        run: |
          # GitHub serves a project site under /<repo>; use the real repo name
          # (correct casing) so every asset resolves.
          export PAGES_BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          echo "Base path: $PAGES_BASE_PATH"
          npm run build
          # Stop GitHub's Jekyll from hiding the _next/ folder.
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
